<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exchange Risk Radar · 交易所风险雷达</title>
  <meta name="description" content="公开交易所公告监控：上币、下架、监控标签与风险警示。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">ER</div>
      <div>
        <h1>Exchange Risk Radar</h1>
        <p>交易所风险雷达 · 公开公告监控</p>
      </div>
    </div>
    <div class="live">
      <span class="dot" id="live-dot"></span>
      <span id="updated">加载中…</span>
    </div>
  </header>

  <main class="wrap">
    <section class="stats" id="stats">
      <div class="stat"><span class="stat-label">总事件</span><strong id="stat-total">—</strong></div>
      <div class="stat"><span class="stat-label">最近 24 小时</span><strong id="stat-24h">—</strong></div>
      <div class="stat"><span class="stat-label">监控标签</span><strong id="stat-tag">—</strong></div>
      <div class="stat"><span class="stat-label">数据源</span><strong id="stat-sources">—</strong></div>
    </section>
    <div class="sources-line" id="sources-line"></div>

    <section class="controls">
      <div class="tabs" id="type-tabs">
        <button class="tab active" data-type="important">重点</button>
        <button class="tab" data-type="all">全部</button>
        <button class="tab" data-type="listing">上币</button>
        <button class="tab" data-type="delisting">下架</button>
        <button class="tab" data-type="monitoring_tag">监控标签</button>
        <button class="tab" data-type="caution">风险警示</button>
        <button class="tab" data-type="maintenance">维护/暂停</button>
      </div>
      <div class="controls-right">
        <select id="exchange-filter" aria-label="交易所筛选">
          <option value="all">全部交易所</option>
          <option value="Binance">Binance</option>
          <option value="Bithumb">Bithumb</option>
        </select>
        <input id="search" type="search" placeholder="搜索代币或标题…" autocomplete="off">
      </div>
    </section>

    <p class="result-line" id="result-line"></p>
    <section class="feed" id="feed" aria-live="polite"></section>
    <div class="empty" id="empty" hidden>
      <p>没有匹配的事件。</p>
      <p class="muted">换个筛选条件，或等待下一次采集。</p>
    </div>
  </main>

  <footer class="footer">
    <p>数据来自 Binance / Bithumb 公开公告接口，仅作信息展示，不构成投资建议。</p>
    <p><span id="generated"></span></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
